<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>五重機關盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #0f0c0a;
    --panel: rgba(26, 20, 16, 0.84);
    --panel-solid: #1c1612;
    --ink: #efe5d3;
    --muted: #a8988a;
    --brass: #d2aa55;
    --brass-deep: #8a6a2c;
    --patina: #74a898;
    --line: rgba(239, 229, 211, 0.14);
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --gutter: 16px;
  }
  html, body { height: 100%; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; height: 100%; overflow: hidden; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

  .hud { position: absolute; pointer-events: none; z-index: 2; }
  .hud > * { pointer-events: auto; }

  .hud-top { top: var(--gutter); left: var(--gutter); right: var(--gutter); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .plaque { pointer-events: auto; }
  .plaque h1 {
    margin: 0; font-family: var(--serif); font-weight: 900; font-size: 26px; letter-spacing: 0.12em;
    color: var(--brass); text-shadow: 0 1px 0 rgba(0,0,0,0.6);
  }
  .plaque p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; letter-spacing: 0.04em; }
  .meta { display: flex; gap: 8px; font-family: var(--mono); font-size: 13px; pointer-events: auto; }
  .meta span { background: var(--panel); border: 1px solid var(--line); padding: 5px 10px; border-radius: 6px; font-variant-numeric: tabular-nums; }

  .locks {
    top: 92px; left: var(--gutter); margin: 0; padding: 10px 12px; list-style: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: grid; gap: 7px; min-width: 188px;
  }
  .locks .cap { font-size: 11px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
  .lock { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
  .lock i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .lock small { color: var(--muted); font-size: 11.5px; }
  .lock.done i { background: var(--patina); border-color: var(--patina); box-shadow: 0 0 8px rgba(116,168,152,0.7); }
  .lock.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(168,152,138,0.5); }

  .views { right: var(--gutter); top: 50%; transform: translateY(-50%); display: grid; gap: 6px; }
  .btn {
    font: 500 13px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; transition: border-color .15s, background .15s, color .15s;
  }
  .btn:hover { border-color: var(--brass-deep); }
  .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .views .btn { width: 44px; height: 40px; padding: 0; font-family: var(--serif); font-size: 15px; }
  .views .btn[aria-pressed="true"] { color: var(--brass); border-color: var(--brass-deep); }

  .bottom { left: var(--gutter); right: var(--gutter); bottom: calc(var(--gutter) + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .tray { display: flex; gap: 8px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .slot {
    width: 58px; height: 58px; border-radius: 9px; border: 1px dashed rgba(239,229,211,0.18); background: rgba(0,0,0,0.25);
    display: grid; place-items: center; cursor: pointer; position: relative; padding: 0; color: var(--ink);
  }
  .slot svg { width: 36px; height: 36px; }
  .slot[data-item] { border-style: solid; border-color: var(--line); }
  .slot[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(210,170,85,0.35), inset 0 0 14px rgba(210,170,85,0.25); }
  .slot:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .actions { display: flex; gap: 8px; }

  .toast {
    position: absolute; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(8px);
    background: var(--panel-solid); border: 1px solid var(--brass-deep); color: var(--ink); padding: 9px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 3; max-width: calc(100% - 32px); text-align: center; text-wrap: balance;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  [hidden] { display: none !important; }
  .card-layer { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8,6,5,0.55); z-index: 4; padding: 16px; }
  .card {
    background: var(--panel-solid); border: 1px solid var(--brass-deep); border-radius: 14px; padding: 22px 24px; max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .card h2 { margin: 0 0 6px; font-family: var(--serif); font-weight: 900; font-size: 22px; color: var(--brass); letter-spacing: 0.08em; text-wrap: balance; }
  .card p { margin: 0 0 14px; line-height: 1.7; color: var(--ink); }
  .card .note { color: var(--muted); font-size: 12.5px; }
  .card .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn.primary { background: var(--brass); color: #1a130b; border-color: var(--brass); font-weight: 700; }
  .btn.primary:hover { background: #e0bb68; }
  .stats { display: flex; gap: 18px; font-family: var(--mono); margin: 4px 0 16px; }
  .stats b { display: block; font-size: 22px; color: var(--ink); font-weight: 500; }
  .stats span { font-size: 11px; color: var(--muted); letter-spacing: .12em; }

  .loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: var(--ground); color: var(--muted); font-family: var(--serif); letter-spacing: 0.2em; transition: opacity .6s; }
  .loading.gone { opacity: 0; pointer-events: none; }

  @media (max-width: 640px) {
    .plaque h1 { font-size: 21px; }
    .plaque p { display: none; }
    .locks { top: 64px; min-width: 0; padding: 7px 10px; grid-auto-flow: column; gap: 10px; }
    .locks .cap, .lock span, .lock small { display: none; }
    .lock { grid-template-columns: 12px; }
    .views { top: auto; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); transform: none; grid-auto-flow: row; }
    .views .btn { width: 40px; height: 36px; }
    .slot { width: 50px; height: 50px; }
    .slot svg { width: 30px; height: 30px; }
    .toast { bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
    .actions { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast, .btn, .loading { transition: none; }
  }
</style>

<div id="app">
  <canvas id="scene" aria-label="可旋轉的 3D 機關盒，點擊或拖曳零件操作"></canvas>

  <div class="hud hud-top">
    <div class="plaque">
      <h1>五重機關盒</h1>
      <p>拖曳旋轉盒子 · 點擊或拖動零件 · 五道鎖全開即破解</p>
    </div>
    <div class="meta"><span id="timer">00:00</span><span id="moves">0 步</span></div>
  </div>

  <ul class="hud locks" id="locks">
    <li class="cap">機關</li>
    <li class="lock" data-lock="slats"><i></i><span>寄木滑板</span><small>左側</small></li>
    <li class="lock" data-lock="rings"><i></i><span>連環轉盤</span><small>右側</small></li>
    <li class="lock" data-lock="gears"><i></i><span>齒輪齒條</span><small>頂蓋</small></li>
    <li class="lock" data-lock="dials"><i></i><span>密碼滾筒</span><small>正面</small></li>
    <li class="lock" data-lock="key"><i></i><span>黃銅鎖孔</span><small>背面</small></li>
  </ul>

  <nav class="hud views" aria-label="切換視角">
    <button class="btn" data-view="front" aria-pressed="true" title="正面">前</button>
    <button class="btn" data-view="left" title="左側">左</button>
    <button class="btn" data-view="right" title="右側">右</button>
    <button class="btn" data-view="back" title="背面">後</button>
    <button class="btn" data-view="top" title="頂蓋">上</button>
  </nav>

  <div class="hud bottom">
      <div class="tray" id="tray" aria-label="道具欄">
        <button class="slot" id="slot-0" aria-pressed="false" aria-label="空道具格"></button>
        <button class="slot" id="slot-1" aria-pressed="false" aria-label="空道具格"></button>
        <button class="slot" id="slot-2" aria-pressed="false" aria-label="空道具格"></button>
      </div>
    <div class="actions">
      <button class="btn" id="btn-sound" aria-pressed="true">音效 開</button>
      <button class="btn" id="btn-hint">提示</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="card-layer" id="intro">
    <div class="card">
      <h2>五重機關盒</h2>
      <p>一只胡桃木盒，五道互相牽連的機關：滑板、轉盤、齒輪、密碼、鑰匙。找到零件、裝上、轉動，打開頂蓋。</p>
      <p class="note">拖曳空白處旋轉視角，滾輪或雙指縮放。零件可點擊；木板與曲柄也能直接拖動。道具先點選，再點要用的位置。</p>
      <div class="row"><button class="btn primary" id="btn-start">開始解謎</button></div>
    </div>
  </div>

  <div class="card-layer" id="hint-layer" hidden>
    <div class="card">
      <h2 id="hint-title">提示</h2>
      <p id="hint-body"></p>
      <div class="row"><button class="btn" id="hint-more">再多一點</button><button class="btn primary" id="hint-close">繼續</button></div>
    </div>
  </div>

  <div class="card-layer" id="win-layer" hidden>
    <div class="card">
      <h2>機關已破</h2>
      <p>頂蓋掀起，盒底的水晶亮了起來。</p>
      <div class="stats"><div><b id="win-time">00:00</b><span>用時</span></div><div><b id="win-moves">0</b><span>操作</span></div><div><b id="win-hints">0</b><span>提示</span></div></div>
      <div class="row"><button class="btn" id="win-close">看看盒子</button><button class="btn primary" id="win-again">再玩一次</button></div>
    </div>
  </div>

  <div class="loading" id="loading">載入機關中…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ───────── 渲染器與場景 ───────── */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f0c0a);
scene.fog = new THREE.Fog(0x0f0c0a, 16, 34);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
const TARGET = new THREE.Vector3(0, 1.35, 0);
camera.position.set(4.2, 5.2, 9.2);

/* ───────── 程序化材質 ───────── */
function rand(seed) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

function woodTexture(base, grain, seed, rings = 150) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const r = rand(seed);
  g.fillStyle = base; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < rings; i++) {
    const y0 = r() * c.height, a1 = 4 + r() * 14, f1 = 0.002 + r() * 0.006, ph = r() * 6.28;
    g.strokeStyle = grain; g.globalAlpha = 0.05 + r() * 0.22; g.lineWidth = 0.6 + r() * 2.6;
    g.beginPath();
    for (let x = 0; x <= c.width; x += 8) {
      const y = y0 + Math.sin(x * f1 + ph) * a1 + Math.sin(x * 0.021 + i) * 1.4;
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
  }
  g.globalAlpha = 0.06;
  for (let i = 0; i < 2200; i++) {
    g.fillStyle = r() > 0.5 ? '#000' : '#fff';
    g.fillRect(r() * c.width, r() * c.height, 1 + r() * 7, 1);
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  // 字型載入後重繪，避免刻字用到後備字型
  t.userData.redraw = () => { draw(c.getContext('2d'), w, h); t.needsUpdate = true; };
  return t;
}

function brassFill(g, w, h) {
  const grad = g.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#caa257'); grad.addColorStop(0.5, '#e2c27a'); grad.addColorStop(1, '#a8823c');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  g.globalAlpha = 0.08; g.fillStyle = '#3a2a10';
  for (let i = 0; i < 400; i++) g.fillRect(Math.random() * w, Math.random() * h, Math.random() * 40, 1);
  g.globalAlpha = 1;
}

const TEX = {
  walnut: woodTexture('#4a2e1c', '#1c0f07', 11),
  maple: woodTexture('#b88a58', '#6b4424', 23, 120),
  wenge: woodTexture('#2c1d15', '#0c0604', 37),
  cherry: woodTexture('#8a4a2c', '#3a1a0c', 51),
  table: woodTexture('#231811', '#0a0604', 71, 220),
};
TEX.table.repeat.set(6, 6);

const MAT = {
  walnut: new THREE.MeshStandardMaterial({ map: TEX.walnut, roughness: 0.58, envMapIntensity: 0.35 }),
  maple: new THREE.MeshStandardMaterial({ map: TEX.maple, roughness: 0.52, envMapIntensity: 0.35 }),
  wenge: new THREE.MeshStandardMaterial({ map: TEX.wenge, roughness: 0.6, envMapIntensity: 0.3 }),
  cherry: new THREE.MeshStandardMaterial({ map: TEX.cherry, roughness: 0.55, envMapIntensity: 0.35 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xc9a04a, metalness: 1, roughness: 0.3, envMapIntensity: 1.1 }),
  brassDark: new THREE.MeshStandardMaterial({ color: 0x7d5c28, metalness: 1, roughness: 0.48, envMapIntensity: 0.9 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x9aa3a8, metalness: 1, roughness: 0.35, envMapIntensity: 1 }),
  velvet: new THREE.MeshStandardMaterial({ color: 0x4a0d1a, roughness: 1, envMapIntensity: 0.2 }),
  void: new THREE.MeshStandardMaterial({ color: 0x050302, roughness: 1, envMapIntensity: 0 }),
  table: new THREE.MeshStandardMaterial({ map: TEX.table, roughness: 0.7, envMapIntensity: 0.25 }),
};

/* ───────── 幾何工具 ───────── */
// BoxGeometry 每面 UV 依實際尺寸縮放，讓木紋密度一致
function woodBox(w, h, d, offset = 0) {
  const geo = new THREE.BoxGeometry(w, h, d);
  const uv = geo.attributes.uv;
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
  for (let f = 0; f < 6; f++) {
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      uv.setXY(i, uv.getX(i) * dims[f][0] / 2.4 + offset, uv.getY(i) * dims[f][1] / 2.4 + offset * 0.37);
    }
  }
  return geo;
}

function add(parent, geo, mat, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos);
  m.rotation.set(...rot);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function group(parent, pos = [0, 0, 0], rot = [0, 0, 0]) {
  const g = new THREE.Group();
  g.position.set(...pos);
  g.rotation.set(...rot);
  parent.add(g);
  return g;
}

/* ───────── 盒身尺寸 ───────── */
const W = 4, H = 2.4, D = 3, T = 0.14, FLOOR = 1.6;
const box = group(scene);

// 下半部實心（藏抽屜與暗格），上半部為四面牆圍出的內膛
add(box, woodBox(W, FLOOR, D), MAT.walnut, [0, FLOOR / 2, 0]);
add(box, woodBox(W, H - FLOOR, T, 0.3), MAT.walnut, [0, (H + FLOOR) / 2, D / 2 - T / 2]);
add(box, woodBox(W, H - FLOOR, T, 0.6), MAT.walnut, [0, (H + FLOOR) / 2, -D / 2 + T / 2]);
add(box, woodBox(T, H - FLOOR, D - 2 * T, 0.2), MAT.walnut, [-W / 2 + T / 2, (H + FLOOR) / 2, 0]);
add(box, woodBox(T, H - FLOOR, D - 2 * T, 0.8), MAT.walnut, [W / 2 - T / 2, (H + FLOOR) / 2, 0]);
add(box, new THREE.PlaneGeometry(W - 2 * T, D - 2 * T), MAT.velvet, [0, FLOOR + 0.002, 0], [-Math.PI / 2, 0, 0]);

// 底座飾條
add(box, woodBox(W + 0.12, 0.12, D + 0.12, 0.5), MAT.wenge, [0, 0.06, 0]);

// 下緣黃銅護角
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  add(box, new THREE.BoxGeometry(0.2, 0.2, 0.2), MAT.brass, [sx * (W / 2 - 0.08), 0.1, sz * (D / 2 - 0.08)]).scale.set(1.12, 1.05, 1.12);
}

// 背面鉸鍊
for (const sx of [-1.2, 1.2]) {
  add(box, new THREE.CylinderGeometry(0.065, 0.065, 0.55, 20), MAT.brass, [sx, H, -D / 2 - 0.02], [0, 0, Math.PI / 2]);
}

/* ───────── 頂蓋（鉸鍊在背緣） ───────── */
const LID_H = 0.3;
const lidPivot = group(scene, [0, H, -D / 2]);
const lid = group(lidPivot, [0, 0, D / 2]); // lid 區域座標：原點在盒頂中心
add(lid, woodBox(W + 0.06, LID_H, D + 0.06, 0.15), MAT.walnut, [0, LID_H / 2, 0]);
add(lid, woodBox(W - 0.5, 0.03, D - 0.5, 0.45), MAT.cherry, [0, LID_H + 0.015, 0]);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  add(lid, new THREE.BoxGeometry(0.22, 0.2, 0.22), MAT.brass, [sx * (W / 2 - 0.08), LID_H - 0.09, sz * (D / 2 - 0.08)]);
}
const LID_TOP = LID_H + 0.03;

/* ───────── 桌面與光 ───────── */
const table = add(scene, new THREE.PlaneGeometry(60, 60), MAT.table, [0, 0, 0], [-Math.PI / 2, 0, 0]);
table.castShadow = false;

scene.add(new THREE.HemisphereLight(0xffeedd, 0x1a120c, 0.35));
const keyLight = new THREE.SpotLight(0xffe0b5, 340, 40, Math.PI / 5.2, 0.55, 2);
keyLight.position.set(4.5, 10, 6.5);
keyLight.target.position.set(0, 1, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0003;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight, keyLight.target);
const rim = new THREE.DirectionalLight(0x9fb8ff, 0.55);
rim.position.set(-6, 5, -7);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd4a0, 0.45);
fill.position.set(-6, 3, 5);
scene.add(fill);
const backFill = new THREE.DirectionalLight(0xffd6a8, 1.1);
backFill.position.set(3, 4, -8);
scene.add(backFill);

/* ───────── 補間動畫 ───────── */
const tweens = [];
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function tween(dur, step, done) { tweens.push({ t: 0, dur, step, done }); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.t += dt;
    const k = Math.min(1, tw.t / tw.dur);
    tw.step(easeInOut(k), k);
    if (k >= 1) { tweens.splice(i, 1); tw.done && tw.done(); }
  }
}
// 被擋住時的回彈：物件沿軸抖一下再回原位
function jiggle(obj, axis, dir, base) {
  tween(0.32, (_, k) => { obj.position[axis] = base + dir * Math.sin(k * Math.PI * 3) * 0.035 * (1 - k); });
}

/* ───────── 可互動物件註冊 ───────── */
const interactives = [];
function interactive(obj, handlers) {
  obj.userData.handlers = handlers;
  // 巢狀物件（例如抽屜裡的鑰匙）已有自己的擁有者時不覆寫
  obj.traverse(o => { if (o.isMesh && (!o.userData.owner || o.userData.owner === obj)) { o.userData.owner = obj; interactives.push(o); } });
}
function removeInteractive(obj) {
  obj.traverse(o => {
    if (o.userData.owner !== obj) return;
    const i = interactives.indexOf(o);
    if (i >= 0) interactives.splice(i, 1);
  });
}
// 細小零件用的隱形點擊範圍，手機上比較好點中
const HIT_MAT = new THREE.MeshBasicMaterial({ visible: false });
function hitProxy(parent, size, pos) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(...size), HIT_MAT);
  m.position.set(...pos);
  parent.add(m);
  return m;
}

/* ───────── 齒輪幾何 ───────── */
function gearGeometry(r, teeth, depth = 0.08, spokes = true) {
  const s = (Math.PI * 2) / teeth, tip = r + 0.034, root = r - 0.036;
  const shape = new THREE.Shape();
  const pt = (rad, a) => [Math.cos(a) * rad, Math.sin(a) * rad];
  for (let i = 0; i < teeth; i++) {
    const a = i * s;
    const pts = [pt(root, a - 0.28 * s), pt(tip, a - 0.14 * s), pt(tip, a + 0.14 * s), pt(root, a + 0.28 * s), pt(root, a + 0.5 * s)];
    pts.forEach(([x, y], j) => (i === 0 && j === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y)));
  }
  shape.closePath();
  const hole = new THREE.Path(); hole.absarc(0, 0, 0.052, 0, Math.PI * 2, true); shape.holes.push(hole);
  if (spokes && r > 0.26) {
    const n = r > 0.4 ? 5 : 4, hr = r * 0.2, hd = r * 0.55;
    for (let i = 0; i < n; i++) {
      const p = new THREE.Path(), a = (i / n) * Math.PI * 2 + 0.3;
      p.absarc(Math.cos(a) * hd, Math.sin(a) * hd, hr, 0, Math.PI * 2, true);
      shape.holes.push(p);
    }
  }
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.006, bevelSegments: 1, curveSegments: 10 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}

function yosegiTexture(seed) {
  return canvasTexture(1024, 96, (g, w, h) => {
    const cols = ['#d9b27c', '#3a2518', '#9a5634', '#e8cfa0', '#5b3a22'];
    const r = rand(seed);
    const step = 48;
    for (let x = 0; x < w; x += step) {
      for (let row = 0; row < 2; row++) {
        const y0 = row * h / 2, y1 = y0 + h / 2;
        g.fillStyle = cols[Math.floor(r() * cols.length)];
        g.beginPath(); g.moveTo(x, y1); g.lineTo(x + step / 2, y0); g.lineTo(x + step, y1); g.fill();
        g.fillStyle = cols[Math.floor(r() * cols.length)];
        g.beginPath(); g.moveTo(x + step / 2, y0); g.lineTo(x + step, y1); g.lineTo(x + step * 1.5, y0); g.fill();
      }
    }
    g.strokeStyle = 'rgba(20,10,4,0.55)'; g.lineWidth = 3;
    g.strokeRect(1.5, 1.5, w - 3, h - 3);
  });
}

function slatHandlers(name, def) {
  let start = 0, axis = null;
  const apply = () => { def.group.position.z = def.dir * def.offset; };

    cursor: 'grab',
    tap() {
      countMove();

      sfx('slide');
      slideTo(def.travel, finish);
    },
    dragStart() {
      start = def.offset;
      const p = new THREE.Vector3(); def.group.getWorldPosition(p);
      axis = screenAxis(p, new THREE.Vector3(0, 0, def.dir));
    },
    dragMove(dx, dy) {

}

// 角度 ψ = atan2(-z, x)；group.rotation.y 直接加在 ψ 上
const N1 = 14, R1 = 0.35, N3 = 18, R3 = 0.45;
const P1 = [-0.95, 0.37], P2 = [-0.3, 0.37], P3 = [0.35, 0.0];
const GY = LID_TOP + 0.05;
const psi = (a, b) => Math.atan2(-(b[1] - a[1]), b[0] - a[0]);
const s1 = (2 * Math.PI) / N1, s2 = (2 * Math.PI) / N2, s3 = (2 * Math.PI) / N3;
const frac = x => x - Math.floor(x);
const TH2_0 = psi(P2, P1) - 0.5 * s2;                          // 與 G1 在 ψ=0 的齒相對
const f2 = frac((psi(P2, P3) - TH2_0) / s2);
const TH3_0 = psi(P3, P2) - (0.5 - f2) * s3;                  // f2 + f3 ≡ 0.5
const RACK_TRAVEL = 0.95, RATIO3 = N1 / N3;

function driveTo(theta) {
  if (S.gearsSolved) return;
  if (S.gearPlaced) {
    const maxD = RACK_TRAVEL / (RATIO3 * R3);
    theta = THREE.MathUtils.clamp(theta, S.theta1Base, S.theta1Base + maxD);

  const moved = Math.abs(theta - S.theta1);
  S.theta1 = theta;
  applyDrive();
  gearTick(moved);
  if (S.gearPlaced && S.travel >= RACK_TRAVEL - 1e-4) solveGears();
}

function toScreen(v) {
  const r = canvas.getBoundingClientRect();
  const p = v.clone().project(camera);

function screenAxis(origin, dir) {

  const h = currentHint();
  hintState = { h, level: 0 };
  S.hints++;
  renderHint();
  $('hint-layer').hidden = false;
});
function renderHint() {
  const { h, level } = hintState;
  $('hint-title').textContent = h.title;
  $('hint-body').textContent = h.lines.slice(0, level + 1).join(' ');
  $('hint-more').hidden = level >= h.lines.length - 1;
}
$('hint-more').addEventListener('click', () => { hintState.level++; renderHint(); });
$('hint-close').addEventListener('click', () => { $('hint-layer').hidden = true; flyTo(hintState.h.view); });

/* ───────── 音效（WebAudio 合成） ───────── */
let actx = null, soundOn = true;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function noise(dur, freq, q, gain, when = 0) {
  const t0 = actx.currentTime + when;
  const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = actx.createGain();
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  src.connect(f).connect(g).connect(actx.destination);
  src.start(t0);
}
function tone(freq, dur, type, gain, when = 0) {
  const t0 = actx.currentTime + when;
  const o = actx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(kind) {
  if (!soundOn || !actx) return;
  if (kind === 'click') { noise(0.035, 3000, 4, 0.5); tone(1700, 0.04, 'square', 0.03); }
  else if (kind === 'tick') noise(0.018, 4200, 6, 0.28);
  else if (kind === 'thunk') { tone(85, 0.14, 'sine', 0.4); noise(0.07, 380, 1, 0.3); }
  else if (kind === 'slide') noise(0.42, 850, 0.6, 0.16);
  else if (kind === 'pick') { tone(880, 0.14, 'triangle', 0.12); tone(1320, 0.2, 'triangle', 0.09, 0.07); }
  else if (kind === 'unlock') { noise(0.05, 2400, 3, 0.55); tone(220, 0.22, 'triangle', 0.2, 0.04); tone(330, 0.34, 'triangle', 0.14, 0.12); }
  else if (kind === 'lid') { noise(1.6, 260, 0.7, 0.14); tone(60, 0.9, 'sine', 0.15); }
  else if (kind === 'chime') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, 1.6, 'sine', 0.1, i * 0.13));
}
$('btn-sound').addEventListener('click', e => {
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? '音效 開' : '音效 關';
  e.currentTarget.setAttribute('aria-pressed', String(soundOn));
});

/* ───────── 開場與結局 ───────── */
$('btn-start').addEventListener('click', () => {
  ensureAudio();
  $('intro').hidden = true;
  S.started = true;
  S.startAt = performance.now();
  flyTo('front');
  setTimeout(() => toast('先四處轉轉看——每一面都有機關'), 900);
});
function showWin() {
  endAt = performance.now();
  $('win-time').textContent = fmtTime(elapsed());
  $('win-moves').textContent = String(S.moves);
  $('win-hints').textContent = String(S.hints);
  $('win-layer').hidden = false;
}
$('win-close').addEventListener('click', () => { $('win-layer').hidden = true; });
$('win-again').addEventListener('click', () => location.reload());

/* ───────── 尺寸與主迴圈 ───────── */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const base = Math.tan(THREE.MathUtils.degToRad(18));
  camera.fov = camera.aspect < 1.1 ? Math.min(66, 2 * THREE.MathUtils.radToDeg(Math.atan(base * 1.1 / camera.aspect * 0.86))) : 36;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
resize();

camera.position.set(...VIEWS.start);
controls.update();

const clock = new THREE.Clock();
let lastSecond = -1;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  updateTweens(dt);
  updateFlight(dt);
  updateCrank(dt);
  const k = Math.min(1, dt * 12);
  rings.forEach(r => { r.pivot.rotation.z += (r.target - r.pivot.rotation.z) * k; });
  dials.forEach(d => { d.mesh.rotation.x += (d.target - d.mesh.rotation.x) * k; });
  if (S.won) crystal.rotation.y += dt * 0.7;
  controls.update();
  renderer.render(scene, camera);
  if (S.started && !endAt) {
    const sec = Math.floor(elapsed());
    if (sec !== lastSecond) { lastSecond = sec; $('timer').textContent = fmtTime(sec); }
  }
});

document.fonts.load('700 92px "Noto Serif TC"', '0123456789IVX左中右').then(() => {
  digitsTex.userData.redraw();
  plaqueTex.userData.redraw();
}).catch(() => {});
$('loading').classList.add('gone');
</script>
